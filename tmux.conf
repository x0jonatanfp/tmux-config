# Opción requerida por pi
set -g extended-keys on

# Focus events: detección de foco para Claude Code / pi
set -g focus-events on

# Latencia de ESC (por defecto 500 ms -> lag al salir de modos de vi)
set -g escape-time 50

# Renumeración de ventanas al cerrar una intermedia
set -g renumber-windows on

# Historial de scrollback (por defecto solo 2000 líneas). Solo afecta a paneles nuevos.
set -g history-limit 50000

# Colores de 24 bits (RGB). Los clientes anuncian xterm-256color sin RGB, y sin esto tmux
# redondea los colores #rrggbb de la barra a la paleta de 256. Verificado el 22-nov-2026:
# termfeatures de los clientes sin RGB antes del cambio.
set -ga terminal-features ",xterm-256color:RGB"

# Al cerrar la última ventana de una sesión salta a otra en vez de desconectar el cliente.
set -g detach-on-destroy off

# El punto ● rosa de la barra marca una ventana cuyo agente está trabajando, sea cual sea:
# su pantalla cambia sin parar (spinner, temporizador, texto nuevo); ver bin/tmux-working.
setw -g monitor-activity off
setw -g monitor-silence 0
set -g visual-activity off

# Portapapeles (11-oct-2026): las apps de dentro (opencode) copian por OSC 52, y
# dentro de tmux la envuelven en un "passthrough" (ESC Ptmux;...). Con
# allow-passthrough en off (el valor por defecto) tmux la TIRABA: la app decía
# «Copied» y no llegaba nada a Windows. Con set-clipboard en external, además,
# tmux ignora las peticiones de copia de las propias apps. Con estas dos, la
# copia de opencode llega al portapapeles de Windows Terminal (probado).
# Revertir: allow-passthrough off + set-clipboard external.
set -g allow-passthrough on
set -g set-clipboard on

# Recarga la configuración con prefix + r
bind r source-file ~/.tmux.conf \; display "Config recargada"

# Barra de estado (rediseño 12-nov-2026).
# Requiere Hack Nerd Font 3.x en el emulador. Paleta: acento fucsia #e879f9 (sesión y hora),
# #f0abfc (ventana activa), métricas verde/amarillo/rojo por carga, git fucsia y fecha cian (Dracula).
# Pastillas redondeadas (glifos Nerd Font) en sesión, ventana activa y hora.
# Izquierda: sesión (se vuelve amarilla con icono de teclado mientras el prefijo está pulsado) y
# ventanas con icono según el programa. Derecha: CPU │ RAM │ DISK │ rama git │ fecha + hora.
set -g status-style "bg=colour235,fg=colour245"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 200
set -g status-left "#{?client_prefix,#[fg=#f1fa8c bg=colour235]#[fg=colour235 bg=#f1fa8c bold]  ,#[fg=#e879f9 bg=colour235]#[fg=colour235 bg=#e879f9 bold]  }#S #{?client_prefix,#[fg=#f1fa8c],#[fg=#e879f9]}#[bg=colour235]#[default] "
# Métricas con color por carga: ~/.local/bin/tmux-sysstat. Rama y estado git (✓ +preparados
# ~modificados ?nuevos !conflictos ⇡⇣ remoto) solo dentro de un repo: ~/.local/bin/tmux-git.
set -g status-right '#(~/.local/bin/tmux-sysstat)#[fg=colour240] │ #(~/.local/bin/tmux-git "#{pane_current_path}")#[fg=#e879f9 bg=colour235]#[fg=colour235 bg=#e879f9 bold]  %H:%M #[fg=#e879f9 bg=colour235]#[default]'

# Ventanas: icono según el nombre (Claude, editores, ssh; terminal por defecto),
# marca de zoom y de paneles sincronizados, y punto de actividad. Nombres cortados a 14 caracteres.
set -g @win_icon "#{?#{m:claude*,#{window_name}},󰚩,#{?#{m:*vim*,#{window_name}},,#{?#{m:ssh*,#{window_name}},󰣀,}}}"
setw -g window-status-style "fg=colour245,bg=colour235"
setw -g window-status-current-style "fg=colour235,bg=#f0abfc,bold"
# Alertas (campana): mismo color que una ventana normal; solo el ● rosa avisa.
# Sin estas líneas tmux pinta la ventana en vídeo inverso.
setw -g window-status-activity-style "fg=colour245,bg=colour235"
setw -g window-status-bell-style "fg=colour245,bg=colour235"
setw -g window-status-format " #I #{E:@win_icon} #{=/14/…:window_name}#{?window_zoomed_flag, 󰊓,}#{?pane_synchronized, 󰓦,}#(~/.local/bin/tmux-working #{pane_id}) "
setw -g window-status-current-format "#[fg=#f0abfc bg=colour235]#[fg=colour235 bg=#f0abfc bold]#I #{E:@win_icon} #{=/14/…:window_name}#{?window_zoomed_flag, 󰊓,}#{?pane_synchronized, 󰓦,}#[fg=#f0abfc bg=colour235]#[default]"
setw -g window-status-separator ""

# Selector de sesiones/ventanas (prefix s / prefix w), mismo estilo que la barra (12-nov-2026).
# Sesión: nº de ventanas y punto verde si está conectada. Ventana: icono por programa, punto
# rosa en la activa y nº de paneles. Panel: comando y ruta con ~. Ordenado por nombre.
set -g @tree_format "#{?pane_format,#[fg=colour252]#{pane_current_command} #[fg=colour240] #{s|^/home/[^/]+|~|:pane_current_path},#{?window_format,#{E:@win_icon} #{window_name}#{?window_active,#[fg=#e879f9] ●,}#[fg=colour240] #{window_panes}p,#[fg=colour245]󰖯 #{session_windows}#{?session_attached,#[fg=#50fa7b] ● conectada,}}}"
# prefix S: árbol clásico de sesiones (prefix s abre el selector fzf, ver más abajo).
bind S choose-tree -Zs -O name -F "#{E:@tree_format}"
bind w choose-tree -Zw -O name -F "#{E:@tree_format}"
# Resaltado de selección (choose-tree, copy-mode, buscar) y menús/popups en rosa.
set -g mode-style "fg=colour235,bg=#e879f9,bold"
set -g menu-style "fg=colour252,bg=colour235"
set -g menu-selected-style "fg=colour235,bg=#e879f9,bold"
set -g menu-border-style "fg=#e879f9"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#e879f9"
set -g popup-border-lines rounded
set -g message-style "fg=colour235,bg=#f0abfc,bold"

# Borde de paneles
setw -g pane-border-style "fg=colour240"
setw -g pane-active-border-style "fg=#e879f9"

# Numeración base 1
set -g base-index 1
setw -g pane-base-index 1

# Ratón
set -g mouse on

# Ventanas y paneles nuevos nacen en la ruta del panel actual (por defecto, en la del
# arranque de la sesión). Mismas teclas de siempre: c, % y ".
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Sin menús del botón derecho (12-nov-2026). El clic derecho en un panel solo lo selecciona
# y, si la app ha pedido ratón (mouse_any_flag), se le reenvía el clic.
bind -n MouseDown3Pane if -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M } { select-pane -t = }
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft

# Selector de sesiones con fzf en popup (12-nov-2026): prefix s y prefix f (sustituye a
# choose-tree y find-window; el árbol clásico queda en prefix S).
# Script: ~/.local/bin/tmux-switch. -B sin borde de tmux porque fzf ya dibuja el suyo.
bind s display-popup -E -B -w 85% -h 70% "~/.local/bin/tmux-switch"
bind f display-popup -E -B -w 85% -h 70% "~/.local/bin/tmux-switch"

# Persistencia tras reinicio. Los plugins los clona install.sh (versiones fijadas) en
# ~/.tmux/plugins. Se restauran sesiones, ventanas, paneles y rutas; los procesos (claude…)
# no vuelven salvo los agentes de abajo. Se guarda cada 15 min y se restaura al arrancar el servidor.
# Los run-shell van SIN -b: en segundo plano continuum cuenta las sesiones cuando `new -s` ya
# ha creado la suya, cree que el servidor no es nuevo y no restaura.
# Agentes: se relanzan retomando su última conversación (`--continue`) en la ruta del panel.
# `claude` casa también con `claude --resume <id>`; `~freebuff` casa con el binario de node.
set -g @resurrect-processes '"claude->claude --continue" "~freebuff->freebuff --continue"'
set -g @continuum-restore on
set -g @continuum-save-interval 15
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
